[package]
name = "plaid-client-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["johnathonfox"]
license = "MIT OR Apache-2.0"
description = "A modern, async Rust client for the Plaid API"
repository = "https://github.com/johnathonfox/plaid-client-rs"
keywords = ["plaid", "fintech", "api", "client", "async"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
secrecy = { version = "0.10", features = ["serde"] }
url = "2.5"
async-trait = "0.1.92"
jsonwebtoken = "9"
sha2 = "0.10.9"
hex = "0.4.3"
rust_decimal = { version = "1.42.1", features = ["macros", "serde-with-float"] }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
serde_path_to_error = "0.1"

[features]
default = []

[[example]]
name = "basic_auth"
path = "docs/examples/basic_auth.rs"

[[example]]
name = "link_token_flow"
path = "docs/examples/link_token_flow.rs"
